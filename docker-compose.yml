# ============================================================================
# Mana Community Sports Service — Docker Compose
# ============================================================================
# Start:   docker compose up -d
# Logs:    docker compose logs -f sports
# Stop:    docker compose down
# ============================================================================

services:
  # ── Spring Boot Sports Service ─────────────────────────────────────
  sports:
    build: .
    container_name: mana-sports
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/mana_community
      SPRING_DATASOURCE_USERNAME: mana
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-mana_dev_password}
      SERVER_PORT: 8082
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mana-sports-net

  # ── PostgreSQL ──────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: mana-sports-db
    environment:
      POSTGRES_DB: mana_community
      POSTGRES_USER: mana
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mana_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mana -d mana_community"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - mana-sports-net

volumes:
  pgdata:

networks:
  mana-sports-net:
    driver: bridge
